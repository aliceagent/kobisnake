<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KOBI Snake</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1c2230;
           color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    .panel { background: #141924; border: 3px solid #2c3546; border-radius: 16px; padding: 40px 48px; max-width: 560px; }
    h1 { margin: 0 0 8px; font-size: 44px; letter-spacing: 2px; }
    h1 span:nth-child(1) { color: #e3261b; } h1 span:nth-child(2) { color: #1f6fe5; }
    h1 span:nth-child(3) { color: #f6c21b; } h1 span:nth-child(4) { color: #2fb44b; }
    p { color: #aeb6c4; margin: 8px 0; line-height: 1.5; }
    a { color: #f6c21b; }
  </style>
</head>
<body>
  <div class="panel">
    <h1><span>K</span><span>O</span><span>B</span><span>I</span> SNAKE</h1>
    <p>Small snake. Big fun.</p>
    <p>The game is being built. This page will become the game once Sprint 00 lands the Vite scaffold.</p>
    <p><a href="https://github.com/aliceagent/kobisnake">Follow the build on GitHub</a></p>
  </div>
</body>
</html>
