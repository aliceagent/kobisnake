# KS-01-04: CI that runs on every PR and every push to main.
#
# Job ids are pinned exactly to `lint`, `typecheck`, `unit`, `build`, `browser` (see KS-01-06's
# branch-protection checklist, which names these as the required status checks). They are five
# separate jobs — not steps in one job — because a GitHub required status check is a job's check
# run, not a step inside it; splitting them also runs lint/typecheck/unit/build in parallel, which
# is what keeps the whole workflow inside the ticket's 6-minute budget even though every job pays
# its own `npm ci`.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# One concurrency group per ref: a PR's ref is unique to that PR, so new pushes to the same PR
# cancel whatever CI run was still going for its previous commit. `main`'s ref never changes, so
# giving pushes to main `cancel-in-progress: false` means two close-together merges both run to
# completion instead of the first being cancelled mid-way — main's CI result is the thing branch
# protection and deploys key off, so it should never be silently abandoned.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    name: unit
    runs-on: ubuntu-latest
    # KS-02-07: coverage thresholds in vitest.config.js (90% src/core, 75% src/game) are pinned to
    # 0 unless COVERAGE_STRICT=1. src/core hit real coverage in Sprint 02, so flip the gate on here
    # — vitest exits non-zero on a missed threshold and the step below is a plain `run:` (no pipe,
    # no continue-on-error), so that failure fails this job for real.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # KI-19-06: two steps, both required, still one check named `unit` so branch protection is untouched.
      #
      # Correctness first, coverage off. This is the step that says whether the game's rules hold, and it is
      # deliberately the one with no coverage instrumentation on it: a run with coverage took long enough that
      # Vitest's own worker-to-main RPC timed out and the process exited non-zero **with every test passing**
      # (`Timeout calling "onTaskUpdate"`, birpc's unconfigurable 60-second window). That was red on `main`
      # for hours and confirmed from this job's own log. `vitest.config.js` has the measurements.
      - name: correctness (every test, coverage off)
        run: npm run test:unit

      # Then the thresholds, over the tests that produce the coverage — 20 s rather than 187 s, so the
      # 60-second window is never load-bearing on the gate again. `test:coverage` sets COVERAGE_STRICT
      # itself, which also closes the trap this job used to carry: the flag lived only in this file, so a
      # local run could be green while the merge gate was red.
      - name: coverage thresholds
        run: npm run test:coverage
      # `if: always()` so a red run (KS-01-04 AC1) still uploads the coverage report that explains
      # it — coverage/ is written by vitest.config.js's v8 provider before the process exits either
      # way, it is only *skipped* if the step above never got to run npm's own script at all.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14

  # e2e + visual, Chromium only — Firefox and WebKit run nightly (nightly.yml) so PRs stay fast.
  # `tests/e2e` includes `offline.spec.js` (KS-01-03), which is the ticket's "offline" step: there
  # is no separate offline script to wire, it rides along with the e2e run.
  browser:
    name: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Read installed Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # GitHub Actions runners don't ship browsers preinstalled, so `playwright install` has to run
      # here. It is not the no-CDN rule's "shipped site" — nothing built downloads anything, this is
      # CI tooling fetching its own test browser. Caching the binaries keyed on the exact
      # @playwright/test version (bumping the dependency invalidates the cache automatically) means
      # a cache hit skips the download; `--with-deps` still installs the OS packages Chromium needs
      # to run headless on the runner.
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: npx playwright install --with-deps chromium

      # Each npm script is its own Playwright invocation (they target different testDirs), so each
      # gets its own HTML report folder via PLAYWRIGHT_HTML_REPORT — otherwise the second run would
      # overwrite the first's report before it could be uploaded. `continue-on-error` on both lets
      # the visual suite still run (and its report still get produced) even if e2e fails first, so a
      # single failing suite doesn't hide the other's result; the step after fails the job for real.
      #
      # Two sequential steps in one job, never two jobs: two Playwright suites at once corrupt both (#86).
      # Both go through `scripts/run-playwright-suite.mjs` (via their npm scripts), whose container-wide lock
      # is what enforces that rather than this comment (KI-03-05 AC2).
      #
      # `--reporter=github,html` added by KI-03-05. `continue-on-error: true` means these steps report
      # `success` in the API even when the suite failed, so the only machine-readable trace of *what* went
      # wrong is a check-run annotation — the job log and the artifact both redirect to blob storage that the
      # egress proxy refuses, which cost one agent session an hour of reproducing a failure it could not
      # read. The `github` reporter emits those annotations; `html` still produces the report uploaded below.
      - name: e2e
        id: e2e
        continue-on-error: true
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/e2e
        run: npm run test:e2e -- --reporter=github,html
      - name: visual
        id: visual
        continue-on-error: true
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/visual
        run: npm run test:visual -- --reporter=github,html
      # KI-19-01 (#200): two steps rather than one, so *which* suite failed is readable without the log.
      # `continue-on-error` above means GitHub reports both suite steps' `conclusion` as `success` whatever
      # happened — only their `outcome` records the truth, and the jobs API exposes the former. A single
      # combined gate therefore said "a suite failed" and nothing more.
      #
      # This is **complementary to KI-03-05's `--reporter=github` above, not a replacement for it**, and the
      # two answer different questions: the annotation names the failing *test*, which is what you want once
      # you know where to look, and these two steps name the failing *suite*, which is what the jobs API can
      # tell you before you have anything to look at. Annotations are also only emitted when Playwright gets
      # far enough to report — a suite that dies in `webServer` start-up produces none, and then the step list
      # is the only thing left.
      - name: e2e failed
        if: steps.e2e.outcome == 'failure'
        run: |
          echo "The e2e suite failed. Reproduce it with: npm run test:e2e"
          echo "Run it on its own — never alongside another Playwright suite (CLAUDE.md, #86)."
          exit 1
      - name: visual failed
        if: steps.visual.outcome == 'failure'
        run: |
          echo "The visual suite failed. Reproduce it with: npm run test:visual"
          echo "If a baseline genuinely changed, update it in a PR labelled needs-design-review."
          exit 1

      # KS-01-04 AC3: downloadable on failure. `test-results/` carries the traces
      # (`trace: 'retain-on-failure'` in playwright.config.js) and any visual diff images.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # KI-08-04 (Improvement 08): the performance budgets of `ARCHITECTURE §12`, on every pull request.
  #
  # ## Why this is its own job and not two more steps in `browser`
  #
  # #86 is that two Playwright suites in **one container** corrupt both. Two GitHub jobs run on two runners,
  # which are two containers and cannot contend at all — `tests/agent/workflows.test.js` says so in its own
  # words, and that is the whole reason it checks routing rather than job graphs. So a separate job satisfies
  # this ticket's AC2 by construction, keeps the draw-call suite off the critical path of a `browser` job that
  # already takes ~10 minutes, and still routes through `scripts/run-playwright-suite.mjs` so that a *future*
  # step added beside it inherits the lock rather than a comment.
  #
  # ## What runs here, and what deliberately does not
  #
  # The two **cheap** budgets, the ones the sprint file puts on every PR: the gzipped bundle total
  # (KI-08-01) and the draw-call budget over five staged scenes (KI-08-02). The frame-time and leak suite
  # (KI-08-03) is nightly instead — `nightly.yml`'s `perf` job — because its churn run drives 500 rounds and
  # the figure it would gate on is already covered here by the draw-call budget. That split is the sprint
  # file's own ("run on every PR for the cheap checks (bundle, draw calls) and nightly for the rest") and is
  # stated here so nobody has to reconstruct it from two workflows.
  #
  # The bundle gate also runs inside the `unit` job, because `tests/perf/bundle.test.js` is an ordinary Vitest
  # test and `npm run test:unit` runs every test. That duplication is deliberate and costs two seconds: this
  # job is where a budget failure is *legible as a budget failure*, and `unit` is what makes it impossible to
  # land a bundle regression by touching this file.
  #
  # NOTE FOR THE OWNER: like `supply-chain`, `perf` is a new check and is **not** in the required-status-check
  # list KS-01-06 pinned (`lint`, `typecheck`, `unit`, `build`, `browser`). It will show red on a pull request
  # but will not block a merge until it is added, which is a repository-settings change agent sessions cannot
  # make. The bundle half is gated regardless, through `unit`.
  perf:
    name: perf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Read installed Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Same cache key shape as `browser` and `agent-playtest.yml`, so these three warm one another's binary.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: npx playwright install --with-deps chromium

      # AC1: a PR that crosses a budget goes red with a message naming the budget and the number. Both steps
      # below fail with exactly that (`checkBundleBudget` and `buildBudgetFailureMessage` build the messages,
      # and both are unit-tested against a fabricated over-budget input, so the text is proven rather than
      # hoped for). Neither carries `continue-on-error`: unlike the `browser` job's two suites, there is no
      # second suite here whose result would be hidden by the first failing.
      #
      # The bundle step builds the site itself, into its own temp directory — see `tests/perf/bundle.test.js`
      # for why it never measures `dist/`.
      - name: Bundle budget (ARCHITECTURE §12, gzipped JS+CSS)
        run: npm run test:perf:bundle

      # `--reporter=github` for the reason KI-03-05 gives: a failed run's job log and artifacts both redirect
      # to blob storage the egress proxy refuses, so a check-run annotation is the only part an agent session
      # can read. `tests/agent/workflows.test.js` enforces that this flag is present on every routed suite
      # invocation, and KI-08-04 added these two scripts to the list it checks.
      - name: Draw-call budget (ARCHITECTURE §12, five staged scenes)
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/perf
        run: npm run test:perf:drawcalls -- --reporter=github,html

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-perf
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # KI-19-01: what ships, and whether the lockfile still describes it.
  #
  # This job is deliberately separate from `build` rather than folded into it: its three checks answer
  # "is this dependency set the one we agreed to?", which is a different question from "does the code
  # compile", and a reader looking at a red PR should be able to tell those apart at a glance.
  #
  # NOTE FOR THE OWNER: `supply-chain` is a new check and is therefore **not** in the required-status-check
  # list KS-01-06 pinned (`lint`, `typecheck`, `unit`, `build`, `browser`). It will show red on a pull request
  # but will not block a merge until it is added, which is a repository-settings change agent sessions cannot
  # make. The lockfile half is gated regardless, because every one of the five required jobs runs `npm ci`,
  # and `npm ci` refuses (`EUSAGE`) when package.json and package-lock.json disagree.
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # AC1, and now the only lockfile check. `npm ci` installs strictly from the lockfile and refuses
      # outright (`npm error code EUSAGE`) when package.json disagrees with it. That is the question worth
      # asking, and `npm ci` is the authority on it — every other required job runs it too, so a genuine
      # mismatch fails five checks, not one.
      - name: npm ci (also the lockfile gate — see below)
        run: |
          if ! npm ci; then
            echo ""
            echo "::error title=Lockfile out of date::npm ci refused - package.json and package-lock.json disagree"
            echo "npm ci installs strictly from the lockfile and refuses when package.json asks for something"
            echo "the lockfile does not describe. Regenerate it and commit the result:"
            echo ""
            echo "    npm install --package-lock-only"
            echo "    git add package-lock.json"
            echo ""
            echo "Do not hand-edit package-lock.json."
            exit 1
          fi

      # KI-19-06 removed a second lockfile step that regenerated package-lock.json and failed on any diff.
      # It was wrong, and it failed 7 of the 8 pull requests KI-19-02's Dependabot config opened on its first
      # Monday — including a plain minor bump of @playwright/test (#262), where:
      #
      #     npm install --package-lock-only && git diff --stat    ->  36 lines removed
      #     npm ci --dry-run                                      ->  exit 0
      #
      # The 36 lines were `"libc": ["glibc"] / ["musl"]` metadata on platform-specific optional packages,
      # which Dependabot's npm writes and this runner's npm prunes on regeneration. Nothing was out of sync.
      #
      # The step asked "would a fresh resolve on *this machine* produce a byte-identical lockfile", which is
      # not the same question as "does the lockfile satisfy package.json" and is not stable across npm
      # versions or platforms. A gate that fails for reasons unrelated to the repository is the failure mode
      # this sprint's own Risks section names, so it is gone rather than tuned. `npm ci` above is the check.

      # AC2, the gate. **Scope: what ships.** `--omit=dev` narrows this to the runtime dependency tree, which
      # is `three` and nothing else — the only code that reaches dist/ and therefore a player's browser. The
      # level is `high`, meaning high and critical fail.
      #
      # Why not the whole tree: at the time this landed `main` carried four advisories (2 critical, 1 high,
      # 1 moderate) and every one of them was a dev dependency — vitest, @vitest/coverage-v8, vite, esbuild.
      # Gating on those would have turned `main` red on this job's first run, for findings that cannot reach a
      # player, and one of them is only clearable by taking Vite from 5 to 8 — a semver-major of the build tool
      # that the visual baselines would have to be re-proved against. A gate that is red for reasons the team
      # has decided not to act on this week is a gate people learn to ignore, which is worse than no gate.
      # So the dev toolchain is reported immediately below instead, and KI-19-02 is the ticket that brings
      # those updates in as reviewable pull requests.
      - name: Audit what ships (runtime dependencies, high and critical)
        run: |
          if ! npm audit --omit=dev --audit-level=high; then
            echo ""
            echo "::error title=Vulnerable runtime dependency::A high or critical advisory affects a package that ships to the browser"
            echo "This is the dependency tree that ends up in dist/, so this one blocks."
            echo "Reproduce with:  npm audit --omit=dev --audit-level=high"
            echo "Then either update the package, or - if there is no fix - say so on the pull request and"
            echo "get the design lead's decision before merging. Do not silence this step."
            exit 1
          fi

      # AC2's other half: the dev toolchain, reported every run and never failing the job. Visible so the four
      # advisories above cannot be quietly forgotten, advisory so they cannot block work that has nothing to do
      # with them. Same reasoning KI-19-00 applied to the wall-clock latency figures.
      - name: Audit the dev toolchain (advisory, never fails)
        run: |
          echo "Dev-dependency advisories. These do not ship; they are reported, not gated (KI-19-01)."
          npm audit || true

      # AC3. `npm sbom` is npm's own, built in since npm 9 — no dependency was added for this, which matters
      # given that a supply-chain ticket adding a supply-chain dependency would be its own small joke.
      # CycloneDX because it is the format Vercel, GitHub and most scanners read.
      - name: Generate the SBOM
        run: |
          npm sbom --sbom-format cyclonedx > sbom.cyclonedx.json
          node -e "const b=require('./sbom.cyclonedx.json');console.log('SBOM:',b.bomFormat,b.specVersion,'-',b.components.length,'components')"

      # Uploaded on every run, not only `main`: AC3 asks for it on every `main` build, and having the same
      # artifact on the pull request is what lets a reviewer diff what a change does to the dependency set
      # before it becomes a `main` build.
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 90
