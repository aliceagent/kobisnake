# KS-01-04: cross-browser + perf coverage that is too slow (or, for perf, not written yet) to put
# on every PR. `ci.yml` already runs the full e2e + visual suite on Chromium for every PR and push
# to main; this workflow adds the two browser engines Chromium can't stand in for, plus a slot for
# the perf specs Sprint 16 will add.
name: Nightly

on:
  schedule:
    # 04:00 UTC daily — outside any sprint's normal working hours, after the day's PRs have landed.
    - cron: '0 4 * * *'
  # Lets a human (or this ticket's QA step) fire the workflow on demand instead of waiting for 04:00.
  workflow_dispatch: {}

env:
  NODE_VERSION: '20'

jobs:
  e2e-cross-browser:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      # One engine failing (e.g. a real WebKit rendering gap) shouldn't cancel the other's run.
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Read installed Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}

      # Chromium ships SwiftShader and renders WebGL on a GPU-less runner out of the box. Firefox does not:
      # it looks for a system GL driver, finds none, and reports "Exhausted GL driver options", so every
      # WebGL page fails before the game gets a chance to be wrong. Installing Mesa's rasteriser did NOT fix
      # it (issue #23) — an X display via xvfb is the next thing to try. Kept so the next attempt starts one
      # step further along. Firefox-only; WebKit passes all three specs.
      - name: Install a software GL driver for Firefox
        if: matrix.browser == 'firefox'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dri mesa-utils

      # playwright.config.js defines a project per engine, so the engine is selected with `--project`.
      # `--browser` cannot be used here: Playwright rejects it outright whenever the config defines any
      # project ("Cannot use --browser option when configuration file defines projects"), which is what
      # issue #21 was. Visual baselines are Chromium-specific, so only e2e runs cross-browser.
      - name: e2e
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/${{ matrix.browser }}
          # Mesa's software rasteriser, for the same reason as the Firefox prefs in playwright.config.js:
          # these runners have no GPU and Firefox, unlike Chromium, ships no software WebGL of its own.
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npx playwright test tests/e2e --project=${{ matrix.browser }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  perf:
    name: perf
    runs-on: ubuntu-latest
    steps:
      # `tests/perf/` doesn't exist yet — it's Sprint 16's (docs/sprints/README.md). This job is the
      # placeholder the ticket asks for so `nightly.yml` already has a slot named `perf` that
      # Sprint 16 turns into a real step, without this ticket creating tests/perf files itself
      # (outside KS-01-04's Files list).
      - name: Perf specs not written yet (Sprint 16)
        run: |
          echo "tests/perf/ does not exist yet — Sprint 16 (Hardening: Performance) adds the specs."
          echo "This step is an intentional placeholder; see docs/sprints/sprint-16-hardening-performance-browsers-accessibility.md"
