# KS-01-04: cross-browser + perf coverage that is too slow (or, for perf, not written yet) to put
# on every PR. `ci.yml` already runs the full e2e + visual suite on Chromium for every PR and push
# to main; this workflow adds the browser engines Chromium can't stand in for, plus a slot for
# the perf specs Sprint 16 will add.
#
# Firefox is deliberately absent. It cannot render WebGL on a GPU-less runner — it finds no system
# GL driver and reports "Exhausted GL driver options", so every spec fails before the game gets a
# chance to be wrong; installing Mesa's rasteriser did not fix it (issue #23). A leg that is red
# every night for fifteen sprints teaches everyone to ignore this workflow, so the design lead ruled
# it removed rather than tolerated (issue #23, ruling 3 on issue #1). Sprint 16 re-adds it —
# KS-16-02 owns getting Firefox green, starting from an X display via xvfb. This removes a job, not
# a test: the same three e2e specs still run on WebKit here and on Chromium in `ci.yml`.
name: Nightly

on:
  schedule:
    # 04:00 UTC daily — outside any sprint's normal working hours, after the day's PRs have landed.
    - cron: '0 4 * * *'
  # Lets a human (or this ticket's QA step) fire the workflow on demand instead of waiting for 04:00.
  workflow_dispatch: {}

env:
  NODE_VERSION: '20'

jobs:
  e2e-cross-browser:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      # One engine failing (e.g. a real WebKit rendering gap) shouldn't cancel the other's run.
      # The matrix is kept with a single entry so Sprint 16 re-adds Firefox by adding one word (#23).
      fail-fast: false
      matrix:
        browser: [webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Read installed Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}

      # playwright.config.js defines a project per engine, so the engine is selected with `--project`.
      # `--browser` cannot be used here: Playwright rejects it outright whenever the config defines any
      # project ("Cannot use --browser option when configuration file defines projects"), which is what
      # issue #21 was. Visual baselines are Chromium-specific, so only e2e runs cross-browser.
      #
      # Through `scripts/run-playwright-suite.mjs` like every other Playwright invocation in this repository
      # (KI-03-05 AC2, #86), so the rule is "no workflow ever calls `playwright test` directly" with no
      # exceptions to remember — `tests/agent/workflows.test.js` asserts exactly that. This leg is the only
      # suite in its own job, so the lock never actually makes it wait; uniformity is the point.
      #
      # `--reporter=github` puts a failure into the check-run annotations, which is the only part of a failed
      # run an agent session can read (the log and artifact endpoints redirect to blob storage the egress
      # proxy refuses). `html` is kept alongside it for a human.
      - name: e2e
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/${{ matrix.browser }}
          # These runners have no GPU, so anything that reaches a GL driver has to be told to rasterise
          # in software. WebKit passes without it, but it is the correct setting for a GPU-less runner
          # and it is what the Firefox leg will need when #23 re-adds it in Sprint 16.
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: >-
          node scripts/run-playwright-suite.mjs e2e-${{ matrix.browser }}
          tests/e2e --project=${{ matrix.browser }} --reporter=github,html

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # KI-09-02 (`docs/sprints/improvement-09-determinism-across-browsers.md`). The determinism spec already
  # runs under WebKit as part of the `e2e (webkit)` leg above — `tests/e2e` is the whole directory — so this
  # job adds no new coverage. What it adds is a **name**.
  #
  # Improvement 09's exit criterion is "the browser reproduces the committed goldens tick for tick, and WebKit
  # runs the same check nightly". Buried among ~65 specs, a determinism failure reports as `e2e (webkit)`
  # failing, which is the same thing a HUD assertion or a rendering gap reports as, and someone has to open the
  # HTML report to tell them apart. Determinism is not that kind of failure: if WebKit and Node ever disagree
  # on the same seed, every replay a player saved is silently wrong, and that deserves to be legible from the
  # run list rather than found. #23's own lesson is on this workflow already — "a leg that is red every night
  # for fifteen sprints teaches everyone to ignore this workflow" — and a leg that is red for *unclear* reasons
  # teaches the same thing faster.
  #
  # `fail-fast` does not apply across jobs, so this reports independently of `e2e (webkit)`: when that leg is
  # red for an unrelated reason (it was on the 2026-09-07 nightly, run 34104157611), this one still answers the
  # only question Improvement 09 asks.
  #
  # The cost is one extra runner and a second WebKit install; the spec itself is five tests and runs in about
  # seven seconds on Chromium. It deliberately runs *only* `determinism.spec.js` (KI-09-02 AC2: no other spec
  # is added to the WebKit leg).
  determinism-webkit:
    name: determinism (webkit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Read installed Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: npx playwright install --with-deps webkit

      # The comparison is driven through the simulation rather than the renderer (the spec builds its rounds
      # through `__kobi` and a detached `RoundSimulation`, never through a rendered frame), so this needs no
      # WebGL of its own. `LIBGL_ALWAYS_SOFTWARE` is set anyway for the same reason the leg above sets it: the
      # page still boots a renderer on load, and these runners have no GPU.
      # Through `scripts/run-playwright-suite.mjs` like every other Playwright invocation in this repository
      # (KI-03-05 AC2, #86), and with `--reporter=github` so a failure lands in the check-run annotations —
      # the only part of a failed run an agent session can read, since the log and artifact endpoints both
      # redirect to blob storage the egress proxy refuses. This leg is the only suite in its own job, so the
      # lock never actually makes it wait; the point is that there is no invocation anyone has to remember to
      # exempt, which is what `tests/agent/workflows.test.js` enforces.
      - name: determinism
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/determinism-webkit
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: >-
          node scripts/run-playwright-suite.mjs determinism-webkit
          tests/e2e/determinism.spec.js --project=webkit --reporter=github,html

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-determinism-webkit
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # KI-08-04 (Improvement 08): the slot KS-01-04 reserved here in Sprint 01 — "a slot named `perf` that
  # Sprint 16 turns into a real step" — filled two sprints early, because `ARCHITECTURE §12`'s budgets are
  # worth enforcing *before* the art lands rather than after (that is Improvement 08's whole premise).
  #
  # ## Why this one is nightly and the other two are on every PR
  #
  # `ci.yml`'s `perf` job runs the two cheap budgets — bundle size and draw calls over five staged scenes —
  # on every pull request. This job runs KI-08-03's frame-time and leak suite, which is the expensive half:
  # its churn check drives 500 whole rounds. The split is the sprint file's own wording, and the trade-off is
  # stated rather than hidden — a residency leak introduced today is found tomorrow morning, not on the PR
  # that caused it. That is acceptable *because* the cheap gate already covers the number §12 actually
  # budgets: the draw-call figure this suite would gate on is gated per-PR by `ci.yml`.
  #
  # `KI_PERF_BASELINE` is deliberately **not** set. Unset, the suite measures and asserts everything and
  # writes nothing; set, it rewrites `docs/qa/playtests/perf-baseline.md`, and a nightly job that edits a
  # committed document has nowhere to put the diff. Regenerating the baseline is a person's job, in a PR.
  perf:
    name: perf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Read installed Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: npx playwright install --with-deps chromium

      # One suite in this job, through `scripts/run-playwright-suite.mjs` like every Playwright invocation in
      # this repository (#86) — the lock never actually makes this leg wait, and uniformity is the point.
      # `--reporter=github` so a failure lands in the check-run annotations, which is the only part of a
      # failed run an agent session can read (KI-03-05).
      - name: Frame-time and leak budgets (KI-08-03)
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/perf
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: npm run test:perf:frametime -- --reporter=github,html

      # `if: always()`: the measurement tables this suite prints are the point of running it nightly, and a
      # red run's are the ones worth reading.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-perf
          path: |
            playwright-report/
            test-results/
          retention-days: 30
          if-no-files-found: warn

  # KI-17-03 (`docs/sprints/improvement-17-mutation-testing.md`), beside the `perf` job above and for the
  # same reason: it is the expensive gate, and expensive gates run nightly rather than on every PR.
  #
  # ## What this gate is for
  #
  # Coverage of `src/core` has been 100 % since Sprint 02 and did not stop six tests that asserted nothing
  # from reaching `main` (#111, #112, #115, #116, #142, #154). This job changes the code 1300-odd ways and
  # fails if too few of those changes are noticed by a test. `QA-STRATEGY §9` is the long version.
  #
  # ## Why the threshold lives in `stryker.config.mjs` and not here
  #
  # `thresholds.break` is what makes `npm run test:mutation` exit non-zero, so the number that fails this job
  # is the same number that fails the command a person runs locally. A second copy of it in this file would
  # be a second thing to forget to update, and the first time the two disagreed the nightly would be either
  # a liar or a nuisance. The job runs the command and reports what the command decided.
  #
  # ## The survivors are named, not just counted
  #
  # A red mutation job whose only output is "85.61 % is below 95 %" tells nobody what to do. Job logs and
  # artifacts are unreadable from an agent session and re-running a job is a 403 (#172), so the survivor list
  # goes into the **job summary**, which is readable — `scripts/mutation-report.mjs` renders the same
  # Markdown that `docs/qa/playtests/mutation-baseline.md` is generated from, so a reviewer diffs the summary
  # against the committed baseline and sees exactly which mutants are new.
  mutation:
    name: mutation (src/core)
    runs-on: ubuntu-latest
    # The `src/core` run is minutes, not hours, but it is the longest job in this workflow and a hung
    # Stryker worker should not hold a runner for six hours. Comfortably above the measured run; well below
    # the default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # No browser install: `src/core` is pure simulation that runs in Node, which is the whole reason it is
      # the affordable target for an exhaustive mutation run (`stryker.config.mjs`).
      - name: Mutation score for src/core (KI-17-03)
        run: npm run test:mutation

      # `if: always()`: a red run's survivor list is the one worth reading, which is the entire point of
      # putting it somewhere an agent session can actually read.
      - name: Survivors and score into the job summary
        if: always()
        run: |
          if [ -f reports/mutation/mutation.json ]; then
            node scripts/mutation-report.mjs \
              --in reports/mutation/mutation.json \
              --title "Mutation run — \`src/core\` @ ${GITHUB_SHA:0:7}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No mutation report was produced — the run failed before reporting." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
          if-no-files-found: warn
